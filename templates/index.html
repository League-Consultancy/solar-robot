<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Solar Robot</title>


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111;

    color: white;

    touch-action: none;
}


/* =========================================================
   MAIN
   ========================================================= */

.container {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;
}


/* =========================================================
   SENSOR PANEL
   ========================================================= */

.sensor-panel {

    position: absolute;

    top: 15px;

    left: 15px;

    width: 220px;

    background: rgba(20,20,20,0.90);

    border-radius: 15px;

    padding: 14px;

    z-index: 100;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.4);

    backdrop-filter: blur(10px);
}


.sensor-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 8px;
}


.sensor-row {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    margin: 4px 0;
}


.sensor-section {

    margin-top: 8px;

    padding-top: 8px;

    border-top: 1px solid #333;
}


.sensor-label {

    color: #999;
}


.sensor-value {

    font-family: monospace;
}


/* =========================================================
   AUTONOMOUS PANEL
   ========================================================= */

.autonomous-panel {

    position: absolute;

    top: 15px;

    right: 15px;

    width: 260px;

    background: rgba(20,20,20,0.92);

    border-radius: 15px;

    padding: 14px;

    z-index: 100;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.4);

    backdrop-filter: blur(10px);
}


.autonomous-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 10px;
}


.auto-row {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    margin: 5px 0;
}


.auto-label {

    color: #999;
}


.auto-value {

    font-family: monospace;

    font-weight: bold;
}


.auto-prediction {

    font-size: 20px;

    margin-top: 8px;

    margin-bottom: 4px;

    font-weight: bold;
}


.auto-confidence {

    color: #aaa;

    font-family: monospace;
}


.prediction-history {

    margin-top: 10px;

    padding-top: 8px;

    border-top: 1px solid #333;

    font-size: 12px;

    color: #aaa;

    line-height: 1.5;
}


/* =========================================================
   MODE SWITCH
   ========================================================= */

.mode-control {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 16px;

    margin: 12px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.08);
}


.mode-control span {

    font-size: 18px;

    font-weight: 600;
}


.switch {

    width: 58px;

    height: 32px;

    border: none;

    border-radius: 20px;

    padding: 3px;

    background: #555;

    cursor: pointer;

    transition: 0.2s;
}


.switch-knob {

    display: block;

    width: 26px;

    height: 26px;

    border-radius: 50%;

    background: white;

    transform: translateX(0);

    transition: 0.2s;
}


.switch.on {

    background: #2ecc71;
}


.switch.on .switch-knob {

    transform: translateX(26px);
}


.switch.auto {

    background: #e67e22;
}


.switch.auto .switch-knob {

    transform: translateX(26px);
}


/* =========================================================
   DEVICE CONTROLS
   ========================================================= */

.device-control {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 16px;

    margin: 12px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.08);
}


.device-control span {

    font-size: 18px;

    font-weight: 600;
}


/* =========================================================
   MOVEMENT AREA
   ========================================================= */

.controls {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   D-PAD
   ========================================================= */

.dpad {

    width: min(85vw, 360px);

    height: min(85vw, 360px);

    display: grid;

    grid-template-columns: 1fr 1fr 1fr;

    grid-template-rows: 1fr 1fr 1fr;

    gap: 12px;
}


.button {

    border: none;

    border-radius: 25px;

    background: #2a2a2a;

    color: white;

    font-size: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;

    transition:
        transform 0.05s,
        background 0.05s;
}


.button:active {

    transform: scale(0.94);

    background: #555;
}


.button.active {

    background: #666;

    transform: scale(0.94);
}


.button.disabled {

    opacity: 0.25;

    pointer-events: none;
}


.forward {

    grid-column: 2;

    grid-row: 1;
}


.left {

    grid-column: 1;

    grid-row: 2;
}


.right {

    grid-column: 3;

    grid-row: 2;
}


.backward {

    grid-column: 2;

    grid-row: 3;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    position: absolute;

    bottom: 15px;

    left: 50%;

    transform: translateX(-50%);

    padding: 8px 18px;

    background: rgba(20,20,20,0.9);

    border-radius: 20px;

    font-size: 13px;

    color: #aaa;

    white-space: nowrap;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .sensor-panel {

        width: 180px;

        font-size: 11px;

        padding: 10px;
    }


    .autonomous-panel {

        width: 190px;

        padding: 10px;

        right: 10px;

        top: 10px;
    }


    .autonomous-title {

        font-size: 13px;
    }


    .auto-row {

        font-size: 11px;
    }


    .auto-prediction {

        font-size: 17px;
    }


    .sensor-panel {

        top: 10px;

        left: 10px;
    }

}


</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     SENSOR WINDOW
     ===================================================== -->

<div class="sensor-panel">

    <div class="sensor-title">
        ROBOT SENSORS
    </div>


    <div class="sensor-section">

        <div class="sensor-row">

            <span class="sensor-label">
                AX
            </span>

            <span id="ax" class="sensor-value">
                --
            </span>

        </div>


        <div class="sensor-row">

            <span class="sensor-label">
                AY
            </span>

            <span id="ay" class="sensor-value">
                --
            </span>

        </div>


        <div class="sensor-row">

            <span class="sensor-label">
                AZ
            </span>

            <span id="az" class="sensor-value">
                --
            </span>

        </div>

    </div>


    <div class="sensor-section">

        <div class="sensor-row">

            <span class="sensor-label">
                GX
            </span>

            <span id="gx" class="sensor-value">
                --
            </span>

        </div>


        <div class="sensor-row">

            <span class="sensor-label">
                GY
            </span>

            <span id="gy" class="sensor-value">
                --
            </span>

        </div>


        <div class="sensor-row">

            <span class="sensor-label">
                GZ
            </span>

            <span id="gz" class="sensor-value">
                --
            </span>

        </div>

    </div>


    <div class="sensor-section">

        <div class="sensor-row">

            <span class="sensor-label">
                TOF
            </span>

            <span id="tof" class="sensor-value">
                -- mm
            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     AUTONOMOUS PANEL
     ===================================================== -->

<div class="autonomous-panel">

    <div class="autonomous-title">
        AUTONOMOUS NAVIGATION
    </div>


    <div class="auto-row">

        <span class="auto-label">
            MODE
        </span>

        <span
            id="autoMode"
            class="auto-value"
        >
            MANUAL
        </span>

    </div>


    <div
        id="autoPrediction"
        class="auto-prediction"
    >
        --
    </div>


    <div
        id="autoConfidence"
        class="auto-confidence"
    >
        Confidence: --
    </div>


    <div class="auto-row">

        <span class="auto-label">
            Decision
        </span>

        <span
            id="autoDecision"
            class="auto-value"
        >
            --
        </span>

    </div>


    <div class="auto-row">

        <span class="auto-label">
            Previous Turn
        </span>

        <span
            id="previousTurn"
            class="auto-value"
        >
            --
        </span>

    </div>


    <div
        id="predictionHistory"
        class="prediction-history"
    >
        Last 5:
        --
    </div>

</div>


<!-- =====================================================
     MOVEMENT
     ===================================================== -->

<div class="controls">

    <div class="dpad">


        <button
            class="button forward"
            data-command="forward"
        >
            ▲
        </button>


        <button
            class="button left"
            data-command="left"
        >
            ◀
        </button>


        <button
            class="button right"
            data-command="right"
        >
            ▶
        </button>


        <button
            class="button backward"
            data-command="backward"
        >
            ▼
        </button>


    </div>

</div>


<!-- =====================================================
     MODE CONTROL
     ===================================================== -->

<div class="mode-control">

    <span>
        Autonomous
    </span>


    <button
        id="autonomousSwitch"
        class="switch"
        type="button"
        aria-pressed="false"
    >

        <span class="switch-knob"></span>

    </button>

</div>


<!-- =====================================================
     BRUSH
     ===================================================== -->

<div class="device-control">

    <span>
        Brush
    </span>


    <button
        id="brushSwitch"
        class="switch"
        type="button"
        aria-pressed="false"
    >

        <span class="switch-knob"></span>

    </button>

</div>


<!-- =====================================================
     PUMP
     ===================================================== -->

<div class="device-control">

    <span>
        Pump
    </span>


    <button
        id="pumpSwitch"
        class="switch on"
        type="button"
        aria-pressed="true"
    >

        <span class="switch-knob"></span>

    </button>

</div>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div
    id="status"
    class="status"
>
    STOPPED
</div>


</div>


<script>


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let activeButton = null;

let activeCommand = null;

let autonomous = false;


/* =========================================================
   SEND MANUAL COMMAND
   ========================================================= */

function sendCommand(command) {

    fetch(
        "/drive/" + command,
        {
            method: "POST"
        }
    )

    .then(
        response => response.json()
    )

    .then(
        data => {

            if (!data.success) {

                console.error(
                    data.error
                );

            }

        }
    )

    .catch(
        error => {

            console.error(
                error
            );

        }
    );
}


/* =========================================================
   START MANUAL MOVEMENT
   ========================================================= */

function startMovement(button) {


    /* -----------------------------------------------
       Autonomous mode blocks manual movement
       ----------------------------------------------- */

    if (autonomous) {

        return;

    }


    /* -----------------------------------------------
       Only one movement at a time
       ----------------------------------------------- */

    if (activeButton !== null) {

        return;

    }


    activeButton = button;

    activeCommand =
        button.dataset.command;


    button.classList.add(
        "active"
    );


    sendCommand(
        activeCommand
    );


    document
        .getElementById("status")
        .innerText =
        activeCommand.toUpperCase();

}


/* =========================================================
   STOP MANUAL MOVEMENT
   ========================================================= */

function stopMovement(button) {


    if (button !== activeButton) {

        return;

    }


    button.classList.remove(
        "active"
    );


    activeButton = null;

    activeCommand = null;


    sendCommand(
        "stop"
    );


    document
        .getElementById("status")
        .innerText =
        "STOPPED";

}


/* =========================================================
   AUTONOMOUS SWITCH
   ========================================================= */

const autonomousSwitch =
    document.getElementById(
        "autonomousSwitch"
    );


const autoMode =
    document.getElementById(
        "autoMode"
    );


autonomousSwitch.addEventListener(
    "click",
    async () => {

        const newState =
            !autonomous;


        try {

            const response =
                await fetch(

                    newState
                        ? "/autonomous/on"
                        : "/autonomous/off",

                    {
                        method: "POST"
                    }

                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Autonomous command failed"
                );

            }


            autonomous =
                newState;


            autonomousSwitch.classList.toggle(
                "auto",
                autonomous
            );


            autonomousSwitch.setAttribute(
                "aria-pressed",
                autonomous
                    ? "true"
                    : "false"
            );


            autoMode.innerText =
                autonomous
                    ? "AUTONOMOUS"
                    : "MANUAL";


            if (autonomous) {

                document
                    .getElementById("status")
                    .innerText =
                    "AUTONOMOUS";

            }
            else {

                document
                    .getElementById("status")
                    .innerText =
                    "STOPPED";

            }


        }
        catch (error) {

            console.error(
                "Autonomous error:",
                error
            );

        }

    }
);


/* =========================================================
   BRUSH
   ========================================================= */

const brushSwitch =
    document.getElementById(
        "brushSwitch"
    );


let brushOn = false;


brushSwitch.addEventListener(
    "click",
    async () => {

        const newState =
            !brushOn;


        try {

            const response =
                await fetch(

                    newState
                        ? "/brush/on"
                        : "/brush/off",

                    {
                        method: "POST"
                    }

                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Brush command failed"
                );

            }


            brushOn =
                data.brush;


            brushSwitch.classList.toggle(
                "on",
                brushOn
            );


            brushSwitch.setAttribute(
                "aria-pressed",
                brushOn
                    ? "true"
                    : "false"
            );

        }
        catch (error) {

            console.error(
                "Brush error:",
                error
            );

        }

    }
);


/* =========================================================
   PUMP
   ========================================================= */

const pumpSwitch =
    document.getElementById(
        "pumpSwitch"
    );


let pumpOn = true;


pumpSwitch.addEventListener(
    "click",
    async () => {

        const newState =
            !pumpOn;


        try {

            const response =
                await fetch(

                    newState
                        ? "/pump/on"
                        : "/pump/off",

                    {
                        method: "POST"
                    }

                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Pump command failed"
                );

            }


            pumpOn =
                data.pump;


            pumpSwitch.classList.toggle(
                "on",
                pumpOn
            );


            pumpSwitch.setAttribute(
                "aria-pressed",
                pumpOn
                    ? "true"
                    : "false"
            );

        }
        catch (error) {

            console.error(
                "Pump error:",
                error
            );

        }

    }
);


/* =========================================================
   TOUCH / MOUSE EVENTS
   ========================================================= */

const buttons =
    document.querySelectorAll(
        ".button"
    );


buttons.forEach(
    button => {


        /* -----------------------------------------------
           POINTER DOWN
           ----------------------------------------------- */

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                if (autonomous) {

                    return;

                }


                button.setPointerCapture(
                    event.pointerId
                );


                startMovement(
                    button
                );

            }
        );


        /* -----------------------------------------------
           POINTER UP
           ----------------------------------------------- */

        button.addEventListener(
            "pointerup",
            event => {

                event.preventDefault();

                stopMovement(
                    button
                );

            }
        );


        /* -----------------------------------------------
           POINTER CANCEL
           ----------------------------------------------- */

        button.addEventListener(
            "pointercancel",
            event => {

                event.preventDefault();

                stopMovement(
                    button
                );

            }
        );


        /* -----------------------------------------------
           POINTER LEAVE
           ----------------------------------------------- */

        button.addEventListener(
            "pointerleave",
            event => {

                if (
                    event.buttons === 0
                ) {

                    stopMovement(
                        button
                    );

                }

            }
        );

    }
);


/* =========================================================
   BROWSER FOCUS SAFETY
   ========================================================= */

window.addEventListener(
    "blur",
    () => {


        if (
            activeButton !== null
        ) {

            activeButton
                .classList
                .remove("active");


            activeButton = null;

            activeCommand = null;


            sendCommand(
                "stop"
            );


            document
                .getElementById("status")
                .innerText =
                "STOPPED";

        }

    }
);


/* =========================================================
   PAGE VISIBILITY SAFETY
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {


        if (
            document.hidden &&
            activeButton !== null
        ) {

            activeButton
                .classList
                .remove("active");


            activeButton = null;

            activeCommand = null;


            sendCommand(
                "stop"
            );

        }

    }
);


/* =========================================================
   SENSOR UPDATE
   ========================================================= */

async function updateSensors() {

    try {

        const response =
            await fetch(
                "/sensors"
            );


        const data =
            await response.json();


        /*
         * Flask returns:
         *
         * acceleration
         * gyroscope
         * temperature
         * tof
         */


        document
            .getElementById("ax")
            .innerText =
            Number(
                data.acceleration.x
            ).toFixed(2);


        document
            .getElementById("ay")
            .innerText =
            Number(
                data.acceleration.y
            ).toFixed(2);


        document
            .getElementById("az")
            .innerText =
            Number(
                data.acceleration.z
            ).toFixed(2);


        document
            .getElementById("gx")
            .innerText =
            Number(
                data.gyroscope.x
            ).toFixed(2);


        document
            .getElementById("gy")
            .innerText =
            Number(
                data.gyroscope.y
            ).toFixed(2);


        document
            .getElementById("gz")
            .innerText =
            Number(
                data.gyroscope.z
            ).toFixed(2);


        if (
            data.tof !== undefined &&
            data.tof !== null
        ) {

            document
                .getElementById("tof")
                .innerText =
                Number(
                    data.tof
                ).toFixed(0)
                + " mm";

        }

    }

    catch (error) {

        console.error(
            "Sensor error:",
            error
        );

    }

}


/* =========================================================
   AUTONOMOUS STATUS UPDATE
   ========================================================= */

async function updateAutonomousStatus() {

    try {

        const response =
            await fetch(
                "/autonomous/status"
            );


        const data =
            await response.json();


        /* -----------------------------------------------
           Autonomous state
           ----------------------------------------------- */

        autonomous =
            data.autonomous;


        autonomousSwitch.classList.toggle(
            "auto",
            autonomous
        );


        autonomousSwitch.setAttribute(
            "aria-pressed",
            autonomous
                ? "true"
                : "false"
        );


        autoMode.innerText =
            autonomous
                ? "AUTONOMOUS"
                : "MANUAL";


        /* -----------------------------------------------
           Prediction
           ----------------------------------------------- */

        const prediction =
            data.prediction || "--";


        document
            .getElementById(
                "autoPrediction"
            )
            .innerText =
            prediction.toUpperCase();


        /* -----------------------------------------------
           Confidence
           ----------------------------------------------- */

        const confidence =
            Number(
                data.confidence || 0
            );


        document
            .getElementById(
                "autoConfidence"
            )
            .innerText =
            "Confidence: " +
            (confidence * 100)
                .toFixed(1) +
            "%";


        /* -----------------------------------------------
           Decision
           ----------------------------------------------- */

        document
            .getElementById(
                "autoDecision"
            )
            .innerText =
            (
                data.decision || "--"
            ).toUpperCase();


        /* -----------------------------------------------
           Previous turn
           ----------------------------------------------- */

        document
            .getElementById(
                "previousTurn"
            )
            .innerText =
            (
                data.previous_turn || "--"
            ).toUpperCase();


        /* -----------------------------------------------
           Prediction history
           ----------------------------------------------- */

        const history =
            data.prediction_history || [];


        if (history.length === 0) {

            document
                .getElementById(
                    "predictionHistory"
                )
                .innerText =
                "Last 5: --";

        }
        else {

            document
                .getElementById(
                    "predictionHistory"
                )
                .innerText =
                "Last 5: " +
                history
                    .map(
                        item =>
                            item.toUpperCase()
                    )
                    .join("  ");

        }


        /* -----------------------------------------------
           Status text
           ----------------------------------------------- */

        if (autonomous) {

            document
                .getElementById(
                    "status"
                )
                .innerText =
                "AUTONOMOUS";

        }

    }

    catch (error) {

        console.error(
            "Autonomous status error:",
            error
        );

    }

}


/* =========================================================
   UPDATE SENSOR DATA
   ========================================================= */

setInterval(
    updateSensors,
    100
);


updateSensors();


/* =========================================================
   UPDATE AI STATUS
   ========================================================= */

setInterval(
    updateAutonomousStatus,
    100
);


updateAutonomousStatus();


</script>


</body>

</html>
